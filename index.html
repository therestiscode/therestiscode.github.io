<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rest is Code</title>
<meta name="description" content="Short videos about code, for beginners.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ground: #1A1B2A; --ink: #F2F2F5; --dim: #9A9CB0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; padding: 2rem 1.25rem;
    background: var(--ground); color: var(--ink);
    font: 500 1.125rem/1.6 Roboto, system-ui, sans-serif;
  }
  main { max-width: 36rem; margin: 0 auto; width: 100%; }
  h1 { font-weight: 900; font-size: clamp(2.5rem, 9vw, 4rem); line-height: 1.05; margin: 0 0 .5rem; }
  .handle { font-family: "JetBrains Mono", ui-monospace, monospace; color: var(--dim); margin: 0 0 2rem; }
  ul { list-style: none; padding: 0; margin: 0 0 3rem; }
  li { margin: .5rem 0; }
  a { color: var(--ink); text-underline-offset: .2em; }
  footer { font-size: .875rem; color: var(--dim); }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>The Rest is Code</h1>
  <p class="handle">@therestiscode</p>
  <p>Short videos about code, for beginners.</p>
  <ul>
    <li><a href="https://www.youtube.com/@therestiscode">Watch on YouTube</a></li>
    <li><a href="https://github.com/therestiscode/notebooks">Notebooks from the videos</a></li>
  </ul>
  <footer><a href="privacy.html">Privacy</a></footer>
</main>
</body>
